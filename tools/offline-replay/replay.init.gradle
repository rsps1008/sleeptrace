// Opt-in only: generated variants never enter main, APKs or ordinary test runs.
gradle.beforeProject { p ->
    if (p.path == ':app') {
        def round = System.getProperty('offlineReplayRound', '1')
        if (!(round in ['1', '2'])) throw new GradleException('offlineReplayRound must be 1 or 2')
        def work = p.file('build/offline-replay' + (round == '2' ? '/round2' : ''))
        p.plugins.withId('com.android.application') {
            p.android.sourceSets.getByName('test').kotlin.srcDir(new File(work, 'generated'))
            p.android.sourceSets.getByName('test').kotlin.srcDir(p.rootProject.file('tools/offline-replay/kotlin'))
        }
        p.tasks.withType(Test).configureEach {
            systemProperty 'offlineReplayDir', work.absolutePath
            systemProperty 'offlineReplayRound', round
            systemProperty 'offlineReplayRepo', p.rootProject.projectDir.absolutePath
            systemProperty 'user.timezone', 'Asia/Taipei'
            outputs.upToDateWhen { false }
        }
    }
}
